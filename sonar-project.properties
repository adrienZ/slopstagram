sonar.organization=adrienz
sonar.projectKey=adrienZ_slopstagram

sonar.sources=core,scripts,app,nitro
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx
sonar.coverage.exclusions=app/shadcn/**,app/routeTree.gen.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The Bunqueue server is spawned as a fixed command with the PATH of the server that started it.
sonar.issue.ignore.multicriteria=spawnFixedCommand
sonar.issue.ignore.multicriteria.spawnFixedCommand.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.spawnFixedCommand.resourceKey=nitro/plugins/warm-cache.ts
