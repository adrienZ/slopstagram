name: Check

on:
  push:
    branches:
      - "**"

permissions:
  actions: read
  checks: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize test report
        run: echo '<testsuites name="Tests" tests="0" failures="0" errors="0"></testsuites>' > reporter.xml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check:ci

      - name: Test report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Tests
          path: reporter.xml
          reporter: java-junit
