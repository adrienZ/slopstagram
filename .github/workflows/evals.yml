name: Evals

# The evals run the real chat model on a CPU runner: they never block a push, and only start for
# changes that can move the Assistant's answers, or by hand.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "evals/**"
      - "core/domains/assistant/**"
      - "core/domains/accounts/**"
      - "core/domains/story-feed/**"
      - "evalite.config.ts"
      - ".github/workflows/evals.yml"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLLAMA_CHAT_MODEL: qwen3.5:0.8b

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-${{ env.OLLAMA_CHAT_MODEL }}

      # Ollama installs and pulls the model in the background while Node and the dependencies
      # install: the "Wait for Ollama" step joins them.
      - name: Install Ollama in the background
        run: |
          nohup bash -c '
            set -e
            trap "touch ollama.failed" ERR
            curl -fsSL https://ollama.com/install.sh | sh
            (ollama serve > ollama.log 2>&1 &)
            until curl -sf localhost:11434/api/version; do sleep 1; done
            ollama pull "$OLLAMA_CHAT_MODEL"
            touch ollama.ready
          ' > ollama-setup.log 2>&1 &

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Wait for Ollama
        run: |
          for _ in $(seq 1 600); do
            [ -f ollama.ready ] && exit 0
            [ -f ollama.failed ] && break
            sleep 1
          done
          cat ollama-setup.log
          exit 1

      # Fails the job when the average score is under `scoreThreshold` (evalite.config.ts).
      - name: Run evals
        run: npm run eval

      # The scores and the answers of every trial, on the page of the run.
      - name: Summarize the evals
        if: ${{ !cancelled() && hashFiles('evalite-export/last-run.json') != '' }}
        run: npm run --silent eval:summary >> "$GITHUB_STEP_SUMMARY"

      # Renders the run above from the SQLite storage (evalite.config.ts). Skipped when that run
      # left no database: the export would run the evals a second time.
      - name: Export the evals report
        if: ${{ !cancelled() && hashFiles('data/evalite.db') != '' }}
        run: npm run eval:export

      - name: Upload the evals report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: evalite-report
          path: evalite-export
