name: Evals

# The evals run the real chat model on a CPU runner, so they start by hand, or when the `evals`
# label is added to a pull request. Not on every push: the `Check` workflow's test report is a check
# run of the commit, and GitHub shows it on any workflow running for the same commit.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  evals:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'evals' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLLAMA_CHAT_MODEL: qwen3.5:0.8b

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-${{ env.OLLAMA_CHAT_MODEL }}

      # Ollama installs and pulls the model in the background while Node and the dependencies
      # install: the "Wait for Ollama" step joins them.
      - name: Install Ollama in the background
        run: |
          nohup bash -c '
            set -e
            trap "touch ollama.failed" ERR
            curl -fsSL https://ollama.com/install.sh | sh
            (ollama serve > ollama.log 2>&1 &)
            until curl -sf localhost:11434/api/version; do sleep 1; done
            ollama pull "$OLLAMA_CHAT_MODEL"
            touch ollama.ready
          ' > ollama-setup.log 2>&1 &

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Wait for Ollama
        run: |
          for _ in $(seq 1 600); do
            [ -f ollama.ready ] && exit 0
            [ -f ollama.failed ] && break
            sleep 1
          done
          cat ollama-setup.log
          exit 1

      # Fails the job when the average score is under `scoreThreshold` (evalite.config.ts).
      - name: Run evals
        run: npm run eval

      # Renders the run above from the SQLite storage (evalite.config.ts). Skipped when that run
      # left no database: the export would run the evals a second time.
      - name: Export the evals report
        if: ${{ !cancelled() && hashFiles('data/evalite.db') != '' }}
        run: npm run eval:export

      - name: Upload the evals report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: evalite-report
          path: evalite-export
