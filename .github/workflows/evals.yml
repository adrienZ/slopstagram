name: Evals

# The evals run the real chat model on a CPU runner, so they only run for changes that can move
# the Assistant's answers, or by hand. The evals job is a required check: on a pull request that
# touches none of those paths it is skipped, which GitHub counts as passing. Path filters on the
# trigger would leave the required check waiting forever instead.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      assistant: ${{ steps.paths.outputs.assistant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find whether the change can move the Assistant's answers
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "assistant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE"..."$HEAD")
          if echo "$changed" | grep -qE '^(evals/|core/domains/(assistant|accounts|story-feed|places|mention-connections)/|evalite\.config\.ts$|\.github/workflows/evals\.yml$)'; then
            echo "assistant=true" >> "$GITHUB_OUTPUT"
          else
            echo "assistant=false" >> "$GITHUB_OUTPUT"
          fi

  evals:
    needs: changes
    if: ${{ needs.changes.outputs.assistant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLLAMA_CHAT_MODEL: qwen3.5:0.8b

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-${{ env.OLLAMA_CHAT_MODEL }}

      # Ollama installs and pulls the model in the background while Node and the dependencies
      # install: the "Wait for Ollama" step joins them.
      - name: Install Ollama in the background
        run: |
          nohup bash -c '
            set -e
            trap "touch ollama.failed" ERR
            curl -fsSL https://ollama.com/install.sh | sh
            (ollama serve > ollama.log 2>&1 &)
            until curl -sf localhost:11434/api/version; do sleep 1; done
            ollama pull "$OLLAMA_CHAT_MODEL"
            touch ollama.ready
          ' > ollama-setup.log 2>&1 &

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Wait for Ollama
        run: |
          for _ in $(seq 1 600); do
            [ -f ollama.ready ] && exit 0
            [ -f ollama.failed ] && break
            sleep 1
          done
          cat ollama-setup.log
          exit 1

      # Fails the job when the average score is under `scoreThreshold` (evalite.config.ts).
      - name: Run evals
        run: npm run eval

      # Renders the run above from the SQLite storage (evalite.config.ts). Skipped when that run
      # left no database: the export would run the evals a second time.
      - name: Export the evals report
        if: ${{ !cancelled() && hashFiles('data/evalite.db') != '' }}
        run: npm run eval:export

      - name: Upload the evals report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: evalite-report
          path: evalite-export
