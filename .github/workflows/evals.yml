name: Evals

# The evals run the real chat model on a CPU runner, so they start by hand, or when the `evals`
# label is added to a pull request. Not on every push: the `Check` workflow's test report is a check
# run of the commit, and GitHub shows it on any workflow running for the same commit.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  evals:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'evals' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLLAMA_CHAT_MODEL: qwen3.5:0.8b

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-${{ env.OLLAMA_CHAT_MODEL }}

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull the chat model
        run: |
          ollama serve > ollama.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf localhost:11434/api/version && break; sleep 1; done
          ollama pull "$OLLAMA_CHAT_MODEL"

      # Fails the job when the average score is under `scoreThreshold` (evalite.config.ts).
      - name: Run evals
        run: npm run eval

      # In memory storage does not outlive the process: the export runs the evals once more.
      - name: Export the evals UI
        if: ${{ !cancelled() }}
        run: npm run eval:export

      - name: Upload the evals UI
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: evalite-ui
          path: evalite-export
